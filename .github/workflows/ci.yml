name: CI

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24] # SDK runtime floor is plain 20; vitest needs 20.12+,
                           # so '20' resolves to the latest 20.x
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install (npm ci)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck (src)
        run: npm run typecheck

      - name: Typecheck (examples compile against the public API)
        run: npm run typecheck:examples

      - name: Test with coverage gate (webhooks/replay >= 90%)
        run: npx vitest run --coverage --coverage.include='src/webhooks/**' --coverage.include='src/replay.ts' --coverage.thresholds.lines=90 --coverage.thresholds.functions=90 --coverage.thresholds.branches=85

  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build and pack
        run: |
          npm ci
          npm run build
          npm pack --dry-run

      - name: Tarball ships only dist + docs (no tests, no js maps, no secrets)
        run: |
          npm pack
          tar -tzf zkp-sdk-node-*.tgz > files.txt
          ! grep -E "tests/|examples/|coverage/|node_modules/" files.txt
          ! grep -E "\.js\.map$" files.txt
          # declaration maps are REQUIRED (PEP-561-style contract): relative
          # sources only - fail on any absolute/local path inside them
          ! grep -rlE '"sources":\s*\["[A-Za-z]:' dist --include="*.d.ts.map"
          ! grep -Ei "secret|password|api[_-]?key" files.txt

      - name: Clean import in ESM and CommonJS projects
        run: |
          TGZ="$(pwd)/zkp-sdk-node-0.1.0.tgz"
          mkdir -p /tmp/esm /tmp/cjs
          cd /tmp/esm
          npm init -y >/dev/null
          npm install "$TGZ" >/dev/null
          node --input-type=module -e "import('zkp-sdk-node').then(m => { if (typeof m.ZeroKYC !== 'function' || m.VERSION !== '0.1.0') process.exit(1); console.log('ESM import OK'); })"
          cd /tmp/cjs
          npm init -y >/dev/null
          npm install "$TGZ" >/dev/null
          node -e "const m = require('zkp-sdk-node'); if (typeof m.ZeroKYC !== 'function' || m.VERSION !== '0.1.0') process.exit(1); console.log('CJS require OK');"

      - name: TypeScript consumer compiles against the shipped types
        run: |
          TGZ="$(pwd)/zkp-sdk-node-0.1.0.tgz"
          mkdir -p /tmp/ts-consumer && cd /tmp/ts-consumer
          npm init -y >/dev/null
          npm install "$TGZ" typescript --no-audit --no-fund >/dev/null
          cat > index.ts <<'TS'
          import { ZeroKYC, idempotencyKey, ReplayGuard, type EventStore } from "zkp-sdk-node";
          const zkp = new ZeroKYC({ apiKey: "pk_test_x", environment: "sandbox" });
          const store: EventStore = { has: async () => false, markProcessed: async () => {} };
          const guard = new ReplayGuard(store);
          void zkp.ping();
          void guard.isDuplicate(idempotencyKey("t", "o", 1));
          TS
          npx tsc --noEmit --strict --module NodeNext --moduleResolution NodeNext --target ES2022 index.ts
          echo "TS consumer OK"

      - uses: actions/upload-artifact@v4
        with:
          name: tarball
          path: zkp-sdk-node-*.tgz
